<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Private Story</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: white;
            color: black;
            display: flex;
            flex-direction: column;
            -webkit-text-size-adjust: 100%;
        }

        /* Content Area */
        #content-container {
            flex: 1;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
            word-wrap: break-word;
            width: 100%;
        }

        /* Floating Lock Button */
        #lock-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        #unlock-btn {
            background: black;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Password Input Popover */
        #password-box {
            background: white;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 4px;
            display: none;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        #passwordInput {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            font-family: Arial, sans-serif;
        }

        #passwordInput::placeholder {
            color: #ccc;
        }

        #submit-btn {
            background: black;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Story text */
        .story-text {
            font-size: 1.1em;
            white-space: pre-wrap;
            margin-bottom: 30px;
        }

        /* Image gallery */
        .image-gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

.story-image {
    display: block;
    max-width: 100%;
    max-height: 80vh;
    width: auto;
    height: auto;
    margin: 0 auto;
    border-radius: 8px;
    object-fit: contain;
}

        /* Placeholder text */
        .placeholder-text {
            color: #888;
            font-style: italic;
            text-align: center;
            margin-top: 20vh;
        }

        /* Mobile adjustments */
        @media (max-width: 767px) {
            #content-container {
                padding: 60px 20px 20px 20px;
            }

            #lock-controls {
                top: 10px;
                right: 10px;
            }

            .story-text {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>

    <div id="lock-controls">
        <button id="unlock-btn" onclick="togglePasswordBox()">Unlock</button>
        <div id="password-box">
            <input type="password" id="passwordInput" placeholder="Enter Password">
            <button id="submit-btn" onclick="attemptUnlock()">Verify</button>
        </div>
    </div>

    <div id="content-container">
        <div id="display-area" class="placeholder-text">
            This content is locked. Click the button to unlock.
        </div>
    </div>

    <script>
        // Replace with your actual Worker URL
        const WORKER_URL = 'https://chat-backend.rsmilga08.workers.dev/check-password';

        function togglePasswordBox() {
            const box = document.getElementById('password-box');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';

            if (box.style.display === 'flex') {
                document.getElementById('passwordInput').focus();
            }
        }

        /**
         * Returns true if the string looks like an image URL.
         */
        function isImageUrl(url) {
            return /\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?.*)?$/i.test(url);
        }

        /**
         * Escapes HTML to prevent injection when displaying text.
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /**
         * Renders content.
         *
         * Supported formats:
         * 1. Plain text
         * 2. Single image URL
         * 3. Multiple image URLs separated by ;
         * 4. Text mixed with image URLs separated by ;
         */
        function renderContent(data) {
            const displayArea = document.getElementById('display-area');
            displayArea.classList.remove('placeholder-text');

            // Split on semicolons and trim whitespace
            const parts = data
                .split(';')
                .map(part => part.trim())
                .filter(part => part.length > 0);

            let textParts = [];
            let imageParts = [];

            for (const part of parts) {
                if (
                    part.startsWith('http://') ||
                    part.startsWith('https://')
                ) {
                    imageParts.push(part);
                } else {
                    textParts.push(part);
                }
            }

            let html = '';

            // Render text if any
            if (textParts.length > 0) {
                html += `
                    <div class="story-text">
                        ${escapeHtml(textParts.join('\n\n'))}
                    </div>
                `;
            }

            // Render images if any
            if (imageParts.length > 0) {
                html += '<div class="image-gallery">';

                for (const imageUrl of imageParts) {
                    html += `
                        <img
                            src="${imageUrl}"
                            class="story-image"
                            alt="Story image"
                            loading="lazy"
                            onerror="this.style.display='none'"
                        >
                    `;
                }

                html += '</div>';
            }

            // Fallback: if there were no semicolons and no URLs, show raw text
            if (html === '') {
                html = `
                    <div class="story-text">
                        ${escapeHtml(data)}
                    </div>
                `;
            }

            displayArea.innerHTML = html;
        }

        async function attemptUnlock() {
            const pwInput = document.getElementById('passwordInput');
            const pw = pwInput.value;
            const displayArea = document.getElementById('display-area');
            const submitBtn = document.getElementById('submit-btn');

            if (!pw) return;

            submitBtn.innerText = 'Checking...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        submittedPassword: pw
                    })
                });

                const result = await response.json();

                if (result.success) {
                    renderContent(result.data);

                    // Hide controls after successful unlock
                    document.getElementById('lock-controls').style.display = 'none';
                } else {
                    alert('Incorrect password.');
                    submitBtn.innerText = 'Verify';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Error connecting to server.');
                submitBtn.innerText = 'Verify';
                submitBtn.disabled = false;
            }
        }

        // Submit with Enter key
        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                attemptUnlock();
            }
        });
    </script>

</body>
</html>
